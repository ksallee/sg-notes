<!doctype html>
<html lang="en" class="dark" data-sg-theme="default">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The theme and the scheme, before the first paint, from the keys $lib/theme writes.
			(function () {
				try {
					var root = document.documentElement;
					var theme = localStorage.getItem('sg-notes:theme');
					if (['default', 'supabase', 'claude'].indexOf(theme) !== -1) root.setAttribute('data-sg-theme', theme);
					var mode = localStorage.getItem('sg-notes:mode') || 'dark';
					var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					root.classList.toggle('dark', dark);
					root.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
