<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><style>/* The mark in src/lib/app/wordmark.svelte with the palette's values pinned, from src/app.css: `--primary`, and the bubble's quiet ink, `--foreground` at 30% over `--background`. The tab strip is not a token, so the gap and the note's lines are cut out rather than painted. */.accent{fill:#006eaf}.quiet{fill:#bdbdbd}@media (prefers-color-scheme:dark){.accent{fill:#38abdf}.quiet{fill:#5b6067}}</style><defs><path id="bubble" d="M20 13 h14 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-14 a4 4 0 0 1 -4 -4 v-5 l-6 -4 6 -1 v-4 a4 4 0 0 1 4 -4 z"/></defs><mask id="gap"><rect width="40" height="40" fill="#fff"/><use href="#bubble" fill="#000" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/></mask><mask id="note"><rect width="40" height="40" fill="#fff"/><rect x="21" y="20" width="12" height="2.4" rx="1.2" fill="#000"/><rect x="21" y="26" width="7" height="2.4" rx="1.2" fill="#000"/></mask><rect class="accent" x="2" y="2" width="22" height="22" rx="2" mask="url(#gap)"/><use href="#bubble" class="quiet" mask="url(#note)"/></svg>
